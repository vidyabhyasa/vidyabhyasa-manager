<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidyabhyasa — Study Center Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16324F;
    --ink-light:#2C4A6E;
    --paper:#FBF8F2;
    --paper-2:#F3EEE2;
    --card:#FFFFFF;
    --line:#E4DFD1;
    --amber:#E3A857;
    --amber-dark:#8A5A16;
    --free:#189B5C;
    --free-bg:#C7EED9;
    --free-text:#0B5C36;
    --occ:#1D6FA5;
    --occ-bg:#C6E2F5;
    --occ-text:#0D4066;
    --warn:#B8890A;
    --warn-bg:#F7E1A8;
    --warn-text:#6B4C06;
    --pend:#6B3FA0;
    --pend-bg:#E3D6F5;
    --pend-text:#3D1E63;
    --overdue:#D9631E;
    --overdue-bg:#FBD9B8;
    --overdue-text:#7A3808;
    --critical:#C81E3A;
    --critical-bg:#F3C0CA;
    --critical-text:#6B0F1D;
    --muted:#7C7566;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:500;margin:0;}
  .app{display:flex;min-height:100vh;}
  .sidebar{
    width:220px;background:var(--ink);color:#EFE7D6;padding:28px 0;
    flex-shrink:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  }
  .brand{padding:0 24px 24px;border-bottom:1px solid rgba(239,231,214,0.15);margin-bottom:16px;}
  .brand h1{font-size:20px;color:#fff;letter-spacing:0.2px;}
  .brand p{font-size:12px;color:#B9C4D4;margin-top:4px;font-family:'Inter',sans-serif;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:12px 24px;font-size:14px;cursor:pointer;
    color:#CBD5E1;border-left:3px solid transparent;transition:background .15s;
  }
  .nav-item:hover{background:rgba(255,255,255,0.05);}
  .nav-item.active{background:rgba(227,168,87,0.12);border-left-color:var(--amber);color:#fff;font-weight:500;}
  .nav-icon{width:16px;text-align:center;font-size:14px;}
  main{flex:1;padding:36px 40px;max-width:1180px;}
  .top-header{
    display:flex;align-items:center;justify-content:flex-end;gap:14px;
    margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--line);
  }
  .top-header .who{font-size:13px;color:var(--muted);}
  .top-header .who strong{color:var(--ink);}
  .top-header a.logout-link{color:var(--amber-dark);font-size:13px;font-weight:500;text-decoration:none;}
  .page-head{margin-bottom:28px;}
  .page-head h2{font-size:24px;color:var(--ink);}
  .page-head p{color:var(--muted);font-size:14px;margin-top:6px;}
  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
  .metric-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
  .metric-card .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;}
  .metric-card .value{font-family:'Fraunces',serif;font-size:28px;margin-top:4px;color:var(--ink);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px 28px;margin-bottom:20px;}
  label{display:block;font-size:13px;font-weight:500;color:var(--ink-light);margin-bottom:6px;}
  input,select{
    width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;
    font-size:14px;font-family:'Inter',sans-serif;background:var(--paper-2);color:var(--ink);margin-bottom:16px;
  }
  input:focus,select:focus{outline:none;border-color:var(--amber);background:#fff;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;}
  .btn{
    display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:8px;border:1px solid var(--ink);
    background:var(--ink);color:#fff;font-size:14px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;
  }
  .btn:hover{background:var(--ink-light);}
  .btn-outline{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn-outline:hover{background:var(--paper-2);}
  .btn-sm{padding:6px 12px;font-size:12px;}
  .btn-wa{background:#3F7856;border-color:#3F7856;}
  .btn-wa:hover{background:#2F5C41;}
  .floor-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .floor-tab{padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:13px;cursor:pointer;color:var(--muted);}
  .floor-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .legend{display:flex;gap:18px;margin-bottom:16px;font-size:12px;color:var(--muted);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .seat-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;}
  .seat-grid h4{font-weight:600;}
  .seat{
    min-height:62px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:transform .1s;
    padding:4px 3px;overflow:hidden;
  }
  .seat-num{line-height:1.2;}
  .seat-name{
    font-size:9px;font-weight:400;line-height:1.2;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:100%;margin-top:2px;opacity:0.85;
  }
  .seat-days{
    font-size:8px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:100%;margin-top:1px;opacity:0.8;letter-spacing:0.2px;
  }
  .seat:hover{transform:scale(1.06);}
  .seat.free{background:var(--free-bg);color:var(--free-text);border-color:var(--free);border-width:1.5px;}
  .seat.occ{background:var(--occ-bg);color:var(--occ-text);border-color:var(--occ);border-width:1.5px;}
  .seat.warn{background:var(--warn-bg);color:var(--warn-text);border-color:var(--warn);border-width:1.5px;}
  .seat.due{background:var(--overdue-bg);color:var(--overdue-text);border-color:var(--overdue);border-width:1.5px;}
  .seat.crit{background:var(--critical-bg);color:var(--critical-text);border-color:var(--critical);border-width:1.5px;animation:pulse-crit 1.6s ease-in-out infinite;}
  .seat.pend{background:var(--pend-bg);color:var(--pend-text);border-color:var(--pend);border-width:1.5px;}
  @keyframes pulse-crit{ 0%,100%{opacity:1;} 50%{opacity:0.62;} }
  .spinner{
    width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--ink);
    border-radius:50%;animation:spin 0.8s linear infinite;
  }
  .spinner.sm{width:18px;height:18px;border-width:2px;}
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .thumb-box{
    display:inline-flex;align-items:center;justify-content:center;
    width:100px;height:100px;background:var(--paper-2);border-radius:8px;border:1px solid var(--line);
  }
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;padding:10px 12px;color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:0.3px;border-bottom:1px solid var(--line);}
  td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
  .badge.active{background:var(--free-bg);color:var(--free-text);}
  .badge.warning{background:var(--warn-bg);color:var(--warn-text);}
  .badge.overdue{background:var(--overdue-bg);color:var(--overdue-text);}
  .badge.critical{background:var(--critical-bg);color:var(--critical-text);}
  .badge.pending{background:var(--pend-bg);color:var(--pend-text);}
  .field-error{color:var(--occ-text);font-size:12px;margin:-12px 0 14px;display:none;}
  .field-error.show{display:block;}
  input.invalid,select.invalid{border-color:var(--occ);background:var(--occ-bg);}
  .metric-card.clickable{cursor:pointer;transition:transform .1s,box-shadow .1s;}
  .metric-card.clickable:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(22,50,79,0.08);}
  .metric-card.metric-occ{border-left:4px solid var(--occ);}
  .metric-card.metric-free{border-left:4px solid var(--free);}
  .metric-card.metric-warn{border-left:4px solid var(--warn);}
  .metric-card.metric-due{border-left:4px solid var(--overdue);}
  .metric-card.metric-crit{border-left:4px solid var(--critical);}
  .metric-card.active-filter{outline:2px solid var(--ink);outline-offset:-1px;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;}
  .bar-label{width:130px;flex-shrink:0;color:var(--ink-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{flex:1;background:var(--paper-2);border-radius:6px;height:10px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--ink);border-radius:6px;}
  .bar-value{width:50px;text-align:right;flex-shrink:0;font-weight:500;color:var(--ink);}
  .filter-row{display:flex;gap:8px;margin-bottom:18px;align-items:center;flex-wrap:wrap;}
  .filter-btn{padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:12px;cursor:pointer;color:var(--muted);}
  .filter-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .search-box{margin-left:auto;width:220px;}
  .search-box input{margin:0;}
  .modal-overlay{position:fixed;inset:0;background:rgba(22,50,79,0.45);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:#fff;border-radius:14px;padding:26px 28px;width:380px;max-width:90vw;}
  .modal h3{font-size:18px;margin-bottom:4px;}
  .row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;gap:14px;}
  .row span:first-child{color:var(--muted);flex-shrink:0;}
  .modal-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
  .empty{color:var(--muted);font-size:14px;padding:30px 0;text-align:center;}
  .toast{
    position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:12px 20px;border-radius:8px;
    font-size:13px;z-index:100;opacity:0;transform:translateY(10px);transition:all .25s;
  }
  .toast.show{opacity:1;transform:translateY(0);}
  .notice{font-size:12px;color:var(--muted);background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:20px;}
  @media(max-width:800px){
    .app{flex-direction:column;}
    .sidebar{width:100%;height:auto;position:relative;padding:16px;display:flex;align-items:center;justify-content:space-between;}
    .brand{border:none;padding:0;margin:0;}
    .nav-item{padding:8px 12px;}
    main{padding:20px;}
    .metrics{grid-template-columns:repeat(2,1fr);}
    .seat-grid{grid-template-columns:repeat(6,1fr);}
    .grid-2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="brand">
      <h1>Vidyabhyasa</h1>
      <p>Study center, Mysuru</p>
    </div>
    <div id="nav">
      <div class="nav-item guest-only" data-page="availability"><span class="nav-icon">◎</span> Availability</div>
      <div class="nav-item auth-only" data-page="dashboard"><span class="nav-icon">▦</span> Dashboard</div>
      <div class="nav-item auth-only" data-page="pending"><span class="nav-icon">⏳</span> Pending approvals</div>
      <div class="nav-item" data-page="register"><span class="nav-icon">＋</span> New registration</div>
      <div class="nav-item auth-only" data-page="subscriptions"><span class="nav-icon">⏰</span> Subscriptions</div>
      <div class="nav-item auth-only founder-only" data-page="reports"><span class="nav-icon">▤</span> Reports</div>
      <div class="nav-item auth-only founder-only" data-page="audit"><span class="nav-icon">☰</span> Audit log</div>
    </div>
  </div>

  <main>
    <div class="top-header" id="top-header"></div>
    <div id="main"></div>
  </main>
</div>

<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script>
// ============================================================
// API helpers — everything talks to the /api/* serverless
// functions (same origin as this page once deployed on Vercel).
// ============================================================
async function apiGet(path){
  const res = await fetch(path, { credentials: 'same-origin' });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}
async function apiPost(path, body){
  const res = await fetch(path, {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

// ============================================================
// Static config
// ============================================================
const FLOORS = [
  { id:'F1', label:'First floor', sub:'Non-AC', count:87 },
  { id:'F2', label:'Second floor', sub:'AC', count:43 }
];
const LOCKERS = [
  { id:'L1', label:'1st floor lockers', sub:'', count:32 },
  { id:'L2', label:'2nd floor lockers', sub:'', count:16 }
];
const LOCKER_MONTHLY = 100;
const LOCKER_DEPOSIT = 200;
const SEAT_TO_LOCKER_FLOOR = { F1:'L1', F2:'L2' };
const PAYMENT_PRESETS = [1000, 1900, 2800];
const GATED_PAGES = ['dashboard', 'subscriptions', 'reports', 'pending', 'audit'];

// Keep these in sync with api/_config.js
const UPI_ID = 'your-upi-id@bank';
const UPI_PAYEE_NAME = 'Vidyabhyasa Study Center';
const RULES_TEXT = [
  'Seats and lockers are allotted for personal use only and cannot be shared or transferred to another person.',
  'A valid photo ID must be uploaded at registration and may be asked for again at the center.',
  'Maintain silence in the study area at all times. Phones must be on silent mode.',
  'Food is not allowed at the seating area. Water bottles are permitted.',
  'The center is not responsible for personal belongings left unattended.',
  'Any damage to furniture or equipment will be charged to the student responsible.',
  'The locker deposit is refundable only on surrender of the locker in good condition.',
  'Fees once paid are non-refundable except at the center\u2019s discretion.',
  'The center reserves the right to reassign or reclaim a seat/locker if fees are not renewed within the grace period after expiry.',
  'Management reserves the right to update these rules; continued use of the center implies acceptance of the current rules.'
];

// ============================================================
// State
// ============================================================
let session = null;               // { role, label } once logged in
let students = [];                 // full records — staff only
let freeSeats = [];                // [{floor,num,resourceId}] — public
let freeLockers = [];
let currentPage = 'availability';
let dashView = 'seats';
let currentFloor = 'F1';
let currentLockerFloor = 'L1';
let dashStatusFilter = 'all';      // all | free | occupied | expiring
let dashSearch = '';
let availView = 'seats';
let availFloorFilter = 'all';
let regFloor = 'F1';
let regStep = 1;                   // 1=rules, 2=details, 3=payment, 4=done
let subFilter = 'all';
let subSearch = '';
let subSort = 'expiry';            // expiry | name | paid
let reportsPreset = 'today';       // today | month | custom
let reportsFrom = '';
let reportsTo = '';
let reportsData = null;
let pendingList = [];              // staff-only: pending approval queue
let cleanupFlags = [];             // staff-only: seats/lockers auto-removed and needing a wipe-down
let auditEntries = [];             // founder-only: audit log

const REG_DRAFT_KEY = 'vidya_register_draft';

// ============================================================
// Routing — real URLs, working back/forward, shareable links.
// ============================================================
const PAGE_PATHS = {
  availability: '/',
  dashboard: '/dashboard',
  pending: '/pending',
  subscriptions: '/subscriptions',
  reports: '/reports',
  audit: '/audit'
};
const PATH_TO_PAGE = {
  '/': 'availability',
  '/dashboard': 'dashboard',
  '/pending': 'pending',
  '/subscriptions': 'subscriptions',
  '/reports': 'reports',
  '/audit': 'audit'
};
const KNOWN_PAGES = ['availability', 'dashboard', 'pending', 'register', 'subscriptions', 'reports', 'audit'];

function pathForPage(page, step){
  if (page === 'register'){
    if (step === 2) return '/register/details';
    if (step === 3) return '/register/payment';
    if (step === 4) return '/register/done';
    return '/register';
  }
  return PAGE_PATHS[page] || '/';
}

function parsePath(pathname){
  const clean = pathname.replace(/\/+$/, '') || '/';
  if (clean.startsWith('/register')){
    const sub = clean.slice('/register'.length);
    let step = 1;
    if (sub === '/details') step = 2;
    else if (sub === '/payment') step = 3;
    else if (sub === '/done') step = 4;
    return { page: 'register', step };
  }
  const page = PATH_TO_PAGE[clean];
  return { page: KNOWN_PAGES.includes(page) ? page : 'availability' };
}

async function loadDataForPage(page){
  if (page === 'availability' || page === 'register') await loadPublicAvailability();
  if (GATED_PAGES.includes(page) && session) await loadFullStudents();
  if (page === 'reports' && session && session.role === 'founder'){
    render();
    await loadReportsData();
  }
  if (page === 'pending' && session){
    render();
    await loadPendingList();
  }
  if (page === 'dashboard' && session){
    await loadPendingList();
    await loadCleanupFlags();
  }
  if (page === 'audit' && session && session.role === 'founder'){
    render();
    await loadAuditLog();
  }
}

// Central navigation entry point — updates state, updates the URL
// (with a real history entry so back/forward work), loads whatever
// data that page needs, then renders. Use this instead of setting
// currentPage directly.
async function navigateTo(page, opts){
  opts = opts || {};
  currentPage = page;
  if (page === 'register' && opts.step) regStep = opts.step;
  const path = pathForPage(page, regStep);
  const state = { page, regStep: page === 'register' ? regStep : undefined };
  if (opts.replace) history.replaceState(state, '', path);
  else history.pushState(state, '', path);
  await loadDataForPage(page);
  render();
}

window.onpopstate = async (event)=>{
  const state = event.state;
  let page, step;
  if (state && state.page){
    page = state.page; step = state.regStep;
  } else {
    const parsed = parsePath(location.pathname);
    page = parsed.page; step = parsed.step;
  }
  currentPage = page;
  if (page === 'register') regStep = step || 1;
  await loadDataForPage(page);
  render();
};

// ============================================================
// Date / status helpers
// ============================================================
function seatLabel(floorId, num){ return floorId + '-' + String(num).padStart(2,'0'); }
function lockerLabel(floorId, num){ return floorId + '-' + String(num).padStart(2,'0'); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addMonths(dateStr, months){
  const d = new Date(dateStr);
  d.setMonth(d.getMonth() + Number(months));
  return d.toISOString().slice(0,10);
}
function daysUntil(dateStr){
  const today = new Date(todayISO());
  const target = new Date(dateStr);
  return Math.round((target - today) / 86400000);
}
function statusForDate(dateStr){
  const d = daysUntil(dateStr);
  if (d <= -1) return 'critical';
  if (d === 0) return 'overdue';
  if (d <= 2) return 'warning';
  return 'active';
}
function statusOf(student){ return statusForDate(student.expiryDate); }
function lockerStatusOf(student){ return student.lockerExpiryDate ? statusForDate(student.lockerExpiryDate) : null; }

// A seat/locker is occupied purely by whether a student row exists
// for it — not by comparing dates. An overdue student still holds
// their seat (shown in escalating warning/error/critical color)
// until either staff remove them or the nightly cleanup job does,
// 3+ days after expiry.
function occupantOf(floorId, seatNum){
  const label = seatLabel(floorId, seatNum);
  return students.find(s => s.seatId === label);
}
function lockerOccupantOf(floorId, num){
  const label = lockerLabel(floorId, num);
  return students.find(s => s.lockerId === label);
}

function paymentAmountOptionsHTML(selected){
  const opts = PAYMENT_PRESETS.map(v=>`<option value="${v}" ${String(v)===String(selected)?'selected':''}>₹${v}</option>`).join('');
  return opts + `<option value="other" ${selected==='other'?'selected':''}>Other (enter amount)</option>`;
}
function totalPaid(student){
  return (student.payments || []).reduce((a,p)=>a+Number(p.amount||0), 0);
}

function waLink(student, kind){
  let phone = (student.phone || '').replace(/\D/g,'');
  if (phone.length === 10) phone = '91' + phone;
  const daysLeft = daysUntil(student.expiryDate);
  let msg;
  if (kind === 'critical'){
    msg = 'Hi ' + student.name + ', your Vidyabhyasa study center seat subscription expired on ' + student.expiryDate + ' and is now significantly overdue. Please renew immediately to avoid losing seat ' + student.seatId + '.';
  } else if (kind === 'overdue'){
    msg = 'Hi ' + student.name + ', your Vidyabhyasa study center seat subscription expired on ' + student.expiryDate + '. Please renew to continue holding seat ' + student.seatId + '.';
  } else {
    msg = 'Hi ' + student.name + ', a reminder that your Vidyabhyasa study center subscription expires on ' + student.expiryDate + ' (' + Math.max(daysLeft,0) + ' day(s) left). Please renew soon to keep seat ' + student.seatId + '.';
  }
  return 'https://wa.me/' + phone + '?text=' + encodeURIComponent(msg);
}
function lockerWaLink(student, kind){
  let phone = (student.phone || '').replace(/\D/g,'');
  if (phone.length === 10) phone = '91' + phone;
  const daysLeft = daysUntil(student.lockerExpiryDate);
  let msg;
  if (kind === 'critical'){
    msg = 'Hi ' + student.name + ', your Vidyabhyasa locker (' + student.lockerId + ') subscription expired on ' + student.lockerExpiryDate + ' and is now significantly overdue. Please renew immediately to avoid losing the locker.';
  } else if (kind === 'overdue'){
    msg = 'Hi ' + student.name + ', your Vidyabhyasa locker (' + student.lockerId + ') subscription expired on ' + student.lockerExpiryDate + '. Please renew to keep the locker.';
  } else {
    msg = 'Hi ' + student.name + ', a reminder that your Vidyabhyasa locker (' + student.lockerId + ') subscription expires on ' + student.lockerExpiryDate + ' (' + Math.max(daysLeft,0) + ' day(s) left). Please renew soon.';
  }
  return 'https://wa.me/' + phone + '?text=' + encodeURIComponent(msg);
}

// ============================================================
// Registration draft (localStorage) — survives switching floors,
// picking a different seat, or an accidental reload, until the
// form is actually submitted.
// ============================================================
function saveRegDraft(){
  const ids = ['f-name','f-phone','f-email','f-exam','f-join','f-months','f-seat','f-locker','f-locker-months','pay-amount','pay-amount-other'];
  const draft = { regFloor, regStep, rulesAccepted: !!draft_rulesAccepted() };
  ids.forEach(id=>{
    const el = document.getElementById(id);
    if (el) draft[id] = el.value;
  });
  try{ localStorage.setItem(REG_DRAFT_KEY, JSON.stringify(draft)); }catch(e){}
}
function draft_rulesAccepted(){
  const el = document.getElementById('rules-accept');
  if (el) return el.checked;
  const existing = loadRegDraft();
  return existing ? !!existing.rulesAccepted : false;
}
function loadRegDraft(){
  try{
    const raw = localStorage.getItem(REG_DRAFT_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function clearRegDraft(){
  try{ localStorage.removeItem(REG_DRAFT_KEY); }catch(e){}
}
function applyRegDraft(){
  const draft = loadRegDraft();
  if (!draft) return;
  Object.keys(draft).forEach(id=>{
    if (id === 'regFloor' || id === 'regStep' || id === 'rulesAccepted') return;
    const el = document.getElementById(id);
    if (el && draft[id]) el.value = draft[id];
  });
}

function readFileAsDataURL(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function resizeImageDataURL(dataUrl, maxDim, quality){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim){
        if (w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = ()=> resolve(dataUrl);
    img.src = dataUrl;
  });
}

function pendingHolds(kind, floorId, num){
  const label = kind === 'seat' ? seatLabel(floorId, num) : lockerLabel(floorId, num);
  return pendingList.find(p => (kind === 'seat' ? p.seatId : p.lockerId) === label);
}

function truncateName(name){
  if (!name) return '';
  return name.length > 11 ? name.slice(0,10) + '…' : name;
}

function buildFloorCells(floor, isLockers, dashStatusFilter, q){
  let html = '';
  let visibleCount = 0;
  for(let i=1;i<=floor.count;i++){
    const occ = isLockers ? lockerOccupantOf(floor.id, i) : occupantOf(floor.id, i);
    const pending = !occ ? pendingHolds(isLockers ? 'locker' : 'seat', floor.id, i) : null;
    const st = occ ? (isLockers ? lockerStatusOf(occ) : statusOf(occ)) : null;
    let cls, cellStatus, cellTitle, personName, daysLabel;
    if (pending){
      cls = 'pend'; cellStatus = 'pending'; cellTitle = pending.name + ' (pending approval)'; personName = pending.name; daysLabel = '';
    } else if (!occ){
      cls = 'free'; cellStatus = 'free'; cellTitle = 'Free'; personName = ''; daysLabel = '';
    } else {
      cellStatus = st;
      cls = st === 'critical' ? 'crit' : st === 'overdue' ? 'due' : st === 'warning' ? 'warn' : 'occ';
      cellTitle = occ.name; personName = occ.name;
      const d = isLockers ? daysUntil(occ.lockerExpiryDate) : daysUntil(occ.expiryDate);
      daysLabel = d >= 0 ? d + 'd left' : Math.abs(d) + 'd over';
      cellTitle += ' — ' + daysLabel;
    }

    let matchesFilter = dashStatusFilter === 'all'
      || dashStatusFilter === cellStatus
      || (dashStatusFilter === 'occupied' && !!occ);
    let matchesSearch = true;
    if (q){
      const seatNumStr = String(i);
      const person = occ || pending;
      matchesSearch = seatNumStr === q || (person && (person.name.toLowerCase().includes(q) || person.phone.includes(q)));
    }
    if (!matchesFilter || !matchesSearch) continue;
    visibleCount++;

    const kindAttr = isLockers ? 'locker' : 'seat';
    const pendAttr = pending ? ' data-pending="1"' : '';
    const nameHtml = personName ? '<span class="seat-name">'+truncateName(personName)+'</span>' : '';
    const daysHtml = daysLabel ? '<span class="seat-days">'+daysLabel+'</span>' : '';
    html += '<div class="seat '+cls+'" data-kind="'+kindAttr+'" data-floor="'+floor.id+'" data-num="'+i+'"'+pendAttr+' title="'+cellTitle+'"><span class="seat-num">'+i+'</span>'+nameHtml+daysHtml+'</div>';
  }
  return { html, visibleCount };
}

function renderDashboard(){
  const totalSeats = FLOORS.reduce((a,f)=>a+f.count,0);
  let seatsOccupied = 0, seatsWarning = 0, seatsError = 0, seatsCritical = 0;
  FLOORS.forEach(f=>{
    for(let i=1;i<=f.count;i++){
      const occ = occupantOf(f.id, i);
      if (occ){
        seatsOccupied++;
        const st = statusOf(occ);
        if (st === 'warning') seatsWarning++;
        else if (st === 'overdue') seatsError++;
        else if (st === 'critical') seatsCritical++;
      }
    }
  });
  const totalLockers = LOCKERS.reduce((a,f)=>a+f.count,0);
  let lockersOccupied = 0, lockersWarning = 0, lockersError = 0, lockersCritical = 0;
  LOCKERS.forEach(f=>{
    for(let i=1;i<=f.count;i++){
      const occ = lockerOccupantOf(f.id, i);
      if (occ){
        lockersOccupied++;
        const st = lockerStatusOf(occ);
        if (st === 'warning') lockersWarning++;
        else if (st === 'overdue') lockersError++;
        else if (st === 'critical') lockersCritical++;
      }
    }
  });

  const isLockers = dashView === 'lockers';
  const total = isLockers ? totalLockers : totalSeats;
  const occupied = isLockers ? lockersOccupied : seatsOccupied;
  const warningCount = isLockers ? lockersWarning : seatsWarning;
  const errorCount = isLockers ? lockersError : seatsError;
  const criticalCount = isLockers ? lockersCritical : seatsCritical;
  const free = total - occupied;
  const list = isLockers ? LOCKERS : FLOORS;
  const activeFloorId = isLockers ? currentLockerFloor : currentFloor;
  const floor = list.find(f=>f.id===activeFloorId) || list[0];

  const q = dashSearch.trim().toLowerCase();
  const isAllFloors = activeFloorId === 'all';
  let cells = '';

  if (isAllFloors){
    list.forEach(f=>{

    });
  } else {
    const result = buildFloorCells(floor, isLockers, dashStatusFilter, q);
    cells = result.html;
    visibleCount = result.visibleCount;
  }
  if (!cells) cells = '<p class="empty" style="grid-column:1/-1;">No seats match this filter.</p>';

  const filterLabel = {
    all:'', free:'Showing free only', occupied:'Showing occupied only',
    warning:'Showing expiring within 2 days', overdue:'Showing overdue (day of expiry) only',
    critical:'Showing 3+ days overdue', pending:'Showing pending approval only'
  }[dashStatusFilter];

  return `
    <div class="page-head">
      <h2>${isLockers ? 'Locker dashboard' : 'Seat dashboard'}</h2>

    </div>

    </div>
    <div class="metrics">

        <div class="label">Total ${isLockers?'lockers':'seats'}</div><div class="value">${total}</div>
      </div>
      <div class="metric-card metric-occ clickable ${dashStatusFilter==='occupied'?'active-filter':''}" data-statusfilter="occupied">
        <div class="label">Occupied</div><div class="value">${occupied}</div>
      </div>
      <div class="metric-card metric-free clickable ${dashStatusFilter==='free'?'active-filter':''}" data-statusfilter="free">
        <div class="label">Free</div><div class="value">${free}</div>
      </div>
      <div class="metric-card metric-warn clickable ${dashStatusFilter==='warning'?'active-filter':''}" data-statusfilter="warning">
        <div class="label">Expiring in 2 days</div><div class="value">${warningCount}</div>
      </div>
    </div>
    <div class="metrics">
      <div class="metric-card metric-due clickable ${dashStatusFilter==='overdue'?'active-filter':''}" data-statusfilter="overdue">
        <div class="label">Overdue (day 0)</div><div class="value">${errorCount}</div>
      </div>
      <div class="metric-card metric-crit clickable ${dashStatusFilter==='critical'?'active-filter':''}" data-statusfilter="critical">
        <div class="label">Critical (1-3+ days)</div><div class="value">${criticalCount}</div>
      </div>
    </div>
    ${renderCleanupPanel()}
    <div class="card">
      <div class="floor-tabs">
        <div class="floor-tab ${isAllFloors?'active':''}" data-floor="all">All floors</div>
        ${list.map(f=>`<div class="floor-tab ${f.id===activeFloorId?'active':''}" data-floor="${f.id}">${f.label}${f.sub?' · '+f.sub:''} (${f.count})</div>`).join('')}

function renderRegisterSeatLockerInner(floor, freeCount){
  const lockerFloorId = SEAT_TO_LOCKER_FLOOR[floor.id];
  const lockerFloor = LOCKERS.find(f=>f.id===lockerFloorId);
  let seatOptions = '';
  for(let i=1;i<=floor.count;i++){
    if (isSeatFree(floor.id, i)) seatOptions += `<option value="${seatLabel(floor.id,i)}">Seat ${i}</option>`;
  }
  let lockerOptions = '<option value="">No locker</option>';
  if (lockerFloor){
    for(let i=1;i<=lockerFloor.count;i++){
      if (isLockerFree(lockerFloor.id, i)) lockerOptions += `<option value="${lockerLabel(lockerFloor.id,i)}">Locker ${i}</option>`;
    }
  }
  return `
    <div>
      <label id="reg-seat-label">Available seats on ${floor.label} (${freeCount} free of ${floor.count})</label>
      <select id="f-seat">${seatOptions || '<option value="">No free seats on this floor</option>'}</select>
    </div>
    <div>
      <label>Locker on ${floor.label} (optional — ₹${LOCKER_MONTHLY}/month + ₹${LOCKER_DEPOSIT} refundable deposit)</label>
      <select id="f-locker">${lockerOptions}</select>
    </div>
  `;
}

function buildUpiQrUrl(amount, note){
  const upiUri = 'upi://pay?pa=' + encodeURIComponent(UPI_ID) + '&pn=' + encodeURIComponent(UPI_PAYEE_NAME) +
    '&am=' + encodeURIComponent(amount) + '&cu=INR&tn=' + encodeURIComponent(note);
  return 'https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=' + encodeURIComponent(upiUri);
}

// Locker adds a flat ₹200 refundable deposit plus ₹100 per month of
// the locker term, on top of whatever the seat amount is.
function computeLockerCharge(draft){
  if (!draft['f-locker']) return 0;
  const months = Number(draft['f-locker-months'] || 1);
  return LOCKER_DEPOSIT + LOCKER_MONTHLY * months;
}

function reportRangeForPreset(preset){
  const now = new Date();
  if (preset === 'today'){
    const d = todayISO();
    return { from: d, to: d };
  }
  if (preset === 'month'){
    const from = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0,10);
    return { from, to: todayISO() };
  }
  return { from: reportsFrom || todayISO(), to: reportsTo || todayISO() };
}

function bar(label, value, max){
  const pct = max > 0 ? Math.round((value / max) * 100) : 0;
  return `
    <div class="bar-row">
      <div class="bar-label">${label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;"></div></div>
      <div class="bar-value">${value}</div>
    </div>`;
}

function timeAgo(isoString){
  const then = new Date(isoString);
  const diffMs = Date.now() - then.getTime();
  const mins = Math.round(diffMs / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + ' min ago';
  const hours = Math.round(mins / 60);
  if (hours < 24) return hours + ' hour' + (hours>1?'s':'') + ' ago';
  const days = Math.round(hours / 24);
  return days + ' day' + (days>1?'s':'') + ' ago';
}

// Modals

function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

// ============================================================
// Image viewing — enlarge in-page (no new tab/window) with a
// loading spinner until the image actually arrives.
// ============================================================
function showImageLightbox(src, title){
  const modalRoot = document.getElementById('modal-root');
  modalRoot.innerHTML = `
    <div class="modal-overlay" id="lightbox-ov" style="z-index:200;">
      <div style="max-width:92vw;max-height:92vh;position:relative;">
        <button class="btn btn-outline" id="lightbox-close" style="position:absolute;top:-46px;right:0;background:#fff;">Close</button>
        <div id="lightbox-loader" style="width:280px;height:280px;max-width:80vw;max-height:70vh;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;">
          <div class="spinner"></div>
        </div>
        <img id="lightbox-img" alt="${title||''}" style="display:none;max-width:92vw;max-height:88vh;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,0.35);">
      </div>
    </div>`;
  const ov = document.getElementById('lightbox-ov');
  ov.onclick = (e)=>{ if (e.target.id==='lightbox-ov') closeModal(); };
  document.getElementById('lightbox-close').onclick = closeModal;

  const img = document.getElementById('lightbox-img');
  const loader = document.getElementById('lightbox-loader');
  img.onload = ()=>{ loader.style.display = 'none'; img.style.display = 'block'; };
  img.onerror = ()=>{ loader.innerHTML = '<p style="color:var(--occ-text);font-size:13px;padding:0 16px;text-align:center;">Could not load this image.</p>'; };
  img.src = src;
}

// Renders a loading spinner into `wrap`, then swaps in the actual
// thumbnail once it loads. Clicking the thumbnail opens the full
// size version via showImageLightbox (same window, not a new tab).
function renderLoadableThumb(wrap, src, title){
  const uid = 'thumb-' + Math.random().toString(36).slice(2);
  const holder = document.createElement('div');
  holder.style.display = 'inline-block';
  holder.innerHTML = `
    <div class="thumb-box" id="${uid}-loader"><div class="spinner sm"></div></div>
    <img id="${uid}-img" alt="${title||''}" title="${title||''} — click to enlarge"
         style="display:none;max-width:160px;max-height:160px;border-radius:8px;border:1px solid var(--line);cursor:pointer;">
  `;
  wrap.appendChild(holder);
  const img = holder.querySelector('#' + uid + '-img');
  const loader = holder.querySelector('#' + uid + '-loader');
  img.onload = ()=>{ loader.style.display = 'none'; img.style.display = 'block'; };
  img.onerror = ()=>{ loader.innerHTML = '<span style="font-size:10px;color:var(--occ-text);text-align:center;padding:4px;">Failed to load</span>'; };
  img.onclick = ()=> showImageLightbox(src, title);
  img.src = src;
}

          <button class="btn" id="es-save">Save changes</button>
          <button class="btn btn-outline" id="close-modal">Close</button>
        </div>
      </div>
    </div>`;
  document.getElementById('close-modal').onclick = closeModal;
  document.getElementById('ov').onclick = (e)=>{ if (e.target.id==='ov') closeModal(); };
  document.getElementById('es-save').onclick = async ()=>{
    const phoneVal = digitsOnly(document.getElementById('es-phone').value);
    if (!isValidPhone(phoneVal)){ showFieldError('es-phone','err-es-phone','Phone number must be exactly 10 digits.'); return; }
    const fields = {
      name: document.getElementById('es-name').value.trim(),
      phone: phoneVal,
      email: document.getElementById('es-email').value.trim() || null,
      examPrep: document.getElementById('es-exam').value.trim()
    };
    try{
      await apiPost('/api/student-actions', { action: 'edit', studentId, fields });
      await loadFullStudents();
      closeModal(); render(); showToast('Details updated');
    }catch(err){ showToast(err.message || 'Failed to save changes'); }
  };
}

function showSwapModal(studentId, kind){
  const s = students.find(x=>x.id===studentId);
  if (!s) return;
  let options = '';
  if (kind === 'seat'){
    FLOORS.forEach(f=>{
      for(let i=1;i<=f.count;i++){
        if (!occupantOf(f.id,i)) options += `<option value="${seatLabel(f.id,i)}" data-floor="${f.id}">${f.label} — Seat ${i}</option>`;
      }
    });
  } else {
    LOCKERS.forEach(f=>{
      for(let i=1;i<=f.count;i++){
        if (!lockerOccupantOf(f.id,i)) options += `<option value="${lockerLabel(f.id,i)}" data-floor="${f.id}">${f.label} — Locker ${i}</option>`;
      }
    });
  }
  const currentLabel = kind === 'seat' ? s.seatId : s.lockerId;
  const modalRoot = document.getElementById('modal-root');
  modalRoot.innerHTML = `
    <div class="modal-overlay" id="ov">
      <div class="modal">
        <h3>Move ${kind}</h3>
        <p style="color:var(--muted);font-size:13px;margin:6px 0 16px;">${s.name} — currently ${kind} ${currentLabel}</p>
        <label>Move to</label>
        <select id="swap-target">${options || `<option value="">No free ${kind}s available</option>`}</select>
        <div class="modal-actions">
          <button class="btn" id="swap-submit">Move</button>
          <button class="btn btn-outline" id="close-modal">Close</button>
        </div>
      </div>
    </div>`;
  document.getElementById('close-modal').onclick = closeModal;
  document.getElementById('ov').onclick = (e)=>{ if (e.target.id==='ov') closeModal(); };
  document.getElementById('swap-submit').onclick = async ()=>{
    const sel = document.getElementById('swap-target');
    const targetId = sel.value;
    if (!targetId){ showToast('No free ' + kind + ' selected'); return; }
    const targetFloor = sel.selectedOptions[0].dataset.floor;
    try{
      await apiPost('/api/student-actions', { action: 'swap', studentId, kind, targetId, targetFloor });
      await loadFullStudents(); await loadPublicAvailability();
      closeModal(); render(); showToast(s.name + ' moved to ' + kind + ' ' + targetId);
    }catch(err){ showToast(err.message || 'Failed to move'); }
  };
}

function wireLoginForm(){
  const emailInput = document.getElementById('login-email');
  const passInput = document.getElementById('login-password');
  const errorMsg = document.getElementById('login-error');
  const doLogin = async ()=>{
    const email = emailInput.value.trim();
    const password = passInput.value;
    if (!email || !password){ errorMsg.textContent = 'Enter both email and password.'; errorMsg.style.display='block'; return; }
    try{
      await apiPost('/api/auth?action=login', { email, password });
    }catch(err){
      errorMsg.textContent = err.message || 'Incorrect email or password.';
      errorMsg.style.display = 'block';
      return;
    }
    await resolveSession();
    if (session) await loadPendingList();
    render();
  };
  document.getElementById('login-submit').onclick = doLogin;
  passInput.onkeydown = (e)=>{ if (e.key === 'Enter') doLogin(); };
  emailInput.focus();
}

function attachHandlers(){
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.onclick = ()=> navigateTo(el.dataset.page);
  });

  if (GATED_PAGES.includes(currentPage) && !session){
    wireLoginForm();
    return;
  }

  if (currentPage === 'dashboard'){
    document.querySelectorAll('.floor-tab[data-view]').forEach(el=>{
      el.onclick = ()=>{ dashView = el.dataset.view; dashStatusFilter = 'all'; dashSearch = ''; render(); };
    });
    document.querySelectorAll('.floor-tab[data-floor]').forEach(el=>{
      el.onclick = ()=>{
        if (dashView === 'lockers') currentLockerFloor = el.dataset.floor;
        else currentFloor = el.dataset.floor;
        render();
      };
    });
    document.querySelectorAll('.metric-card[data-statusfilter]').forEach(el=>{
      el.onclick = ()=>{
        const f = el.dataset.statusfilter;
        dashStatusFilter = (dashStatusFilter === f) ? 'all' : f;
        render();
      };
    });
    document.querySelectorAll('.filter-btn[data-dashfilter]').forEach(el=>{
      el.onclick = ()=>{ dashStatusFilter = el.dataset.dashfilter; render(); };
    });
    const clearLink = document.getElementById('dash-clear-filter');
    if (clearLink) clearLink.onclick = (e)=>{ e.preventDefault(); dashStatusFilter = 'all'; render(); };
    const dashSearchInput = document.getElementById('dash-search');
    if (dashSearchInput){
      dashSearchInput.oninput = ()=>{ dashSearch = dashSearchInput.value; render(); };
      dashSearchInput.focus();
      dashSearchInput.setSelectionRange(dashSearchInput.value.length, dashSearchInput.value.length);
    }
    document.querySelectorAll('.seat').forEach(el=>{
      el.onclick = ()=>{
        if (el.dataset.pending) return showPendingHoldModal(el.dataset.kind, el.dataset.floor, Number(el.dataset.num));
        showStaffSeatModal(el.dataset.kind, el.dataset.floor, Number(el.dataset.num));
      };
    });
    document.querySelectorAll('[data-clearcleanup]').forEach(el=>{
      el.onclick = async ()=>{
        el.disabled = true; el.textContent = 'Clearing…';
        try{
          await apiPost('/api/cleanup', { flagId: el.dataset.clearcleanup });
          await loadCleanupFlags();
          render();
        }catch(err){
          showToast(err.message || 'Failed to update');
          el.disabled = false; el.textContent = 'Mark cleaned';
        }
      };
    });
  }

  if (currentPage === 'availability'){
    document.querySelectorAll('.seat').forEach(el=>{
      el.onclick = ()=> showPublicResourceModal(el.dataset.kind, el.dataset.floor, Number(el.dataset.num));
    });
    document.querySelectorAll('.floor-tab[data-availview]').forEach(el=>{
      el.onclick = ()=>{ availView = el.dataset.availview; availFloorFilter = 'all'; render(); };
    });
    document.querySelectorAll('#avail-floor-filter .floor-tab').forEach(el=>{
      el.onclick = ()=>{ availFloorFilter = el.dataset.availfloor; render(); };
    });
  }

  if (currentPage === 'register' && regStep === 1){
    const cb = document.getElementById('rules-accept');
    const continueBtn = document.getElementById('rules-continue-btn');
    cb.onchange = ()=>{
      continueBtn.disabled = !cb.checked;
      const existing = loadRegDraft() || {};
      existing.rulesAccepted = cb.checked;
      existing.regFloor = regFloor;
      existing.regStep = 1;
      try{ localStorage.setItem(REG_DRAFT_KEY, JSON.stringify(existing)); }catch(e){}
    };
    continueBtn.onclick = ()=>{ goToRegStep(2); };
  }

  if (currentPage === 'register' && regStep === 2){
    const form = document.getElementById('reg-form');

    // Restore whatever was typed before (survives switching floors, an
    // accidental reload, or navigating away without submitting).
    applyRegDraft();

    document.getElementById('reg-back-btn').onclick = ()=>{ saveRegDraft(); goToRegStep(1); };

    document.querySelectorAll('#reg-floor-tabs .floor-tab').forEach(el=>{
      el.onclick = ()=>{
        saveRegDraft();
        regFloor = el.dataset.regfloor;
        document.querySelectorAll('#reg-floor-tabs .floor-tab').forEach(t=>t.classList.remove('active'));
        el.classList.add('active');
        let freeCount = 0;
        const floor = FLOORS.find(f=>f.id===regFloor) || FLOORS[0];
        for(let i=1;i<=floor.count;i++){ if (isSeatFree(floor.id,i)) freeCount++; }
        document.getElementById('reg-seat-locker-row').innerHTML = renderRegisterSeatLockerInner(floor, freeCount);
        // locker floor changed, so any previous locker selection is no longer valid
        document.getElementById('f-locker-months-wrap').style.display = 'none';
        wireLockerSelect();
        const seatSel = document.getElementById('f-seat');
        if (seatSel) seatSel.onchange = saveRegDraft;
      };
    });

    function wireLockerSelect(){
      const lockerSel = document.getElementById('f-locker');
      const lockerMonthsWrap = document.getElementById('f-locker-months-wrap');
      lockerMonthsWrap.style.display = lockerSel.value ? 'block' : 'none';
      lockerSel.onchange = ()=>{ lockerMonthsWrap.style.display = lockerSel.value ? 'block' : 'none'; saveRegDraft(); };
    }
    wireLockerSelect();
    document.getElementById('f-seat').onchange = saveRegDraft;

    // Live phone validation: digits only, capped at 10.
    const phoneInput = document.getElementById('f-phone');
    phoneInput.oninput = ()=>{
      phoneInput.value = digitsOnly(phoneInput.value).slice(0,10);
      clearFieldError('f-phone','err-phone');
      saveRegDraft();
    };
    ['f-name','f-email','f-exam','f-join','f-months','f-locker-months'].forEach(id=>{
      const el = document.getElementById(id);
      if (el) el.addEventListener('input', saveRegDraft);
    });

    const fileInput = document.getElementById('f-id-file');
    const preview = document.getElementById('f-id-preview');
    fileInput.onchange = async ()=>{
      const file = fileInput.files[0];
      if (!file){ preview.style.display = 'none'; preview.innerHTML=''; return; }
      const raw = await readFileAsDataURL(file);
      const resized = await resizeImageDataURL(raw, 900, 0.72);
      fileInput.dataset.resized = resized;
      const existing = loadRegDraft() || {};
      existing.idPhotoBase64 = resized;
      try{ localStorage.setItem(REG_DRAFT_KEY, JSON.stringify(existing)); }catch(e){}
      preview.style.display = 'block';
      preview.innerHTML = `<img src="${resized}" style="max-width:140px;max-height:100px;border-radius:6px;border:1px solid var(--line);">`;
    };

    form.onsubmit = (e)=>{
      e.preventDefault();

      let valid = true;
      const nameVal = document.getElementById('f-name').value.trim();
      const phoneVal = document.getElementById('f-phone').value.trim();
      const emailVal = document.getElementById('f-email').value.trim();
      const examVal = document.getElementById('f-exam').value.trim();
      const joinVal = document.getElementById('f-join').value;
      const seatId = document.getElementById('f-seat').value;

      clearFieldError('f-name','err-name');
      clearFieldError('f-phone','err-phone');
      clearFieldError('f-email','err-email');
      clearFieldError('f-exam','err-exam');
      clearFieldError('f-join','err-join');

      if (!nameVal || nameVal.length < 2){ showFieldError('f-name','err-name',"Enter the student's full name."); valid = false; }
      if (!isValidPhone(phoneVal)){ showFieldError('f-phone','err-phone','Phone number must be exactly 10 digits.'); valid = false; }
      if (!isValidEmail(emailVal)){ showFieldError('f-email','err-email','Enter a valid email address, or leave it blank.'); valid = false; }
      if (!examVal){ showFieldError('f-exam','err-exam','Enter the exam this student is preparing for.'); valid = false; }
      if (!joinVal){ showFieldError('f-join','err-join','Pick a date of joining.'); valid = false; }
      if (!seatId){ showToast('No seat selected'); valid = false; }
      if (!valid) return;

      saveRegDraft();
      goToRegStep(3);
    };
  }

  if (currentPage === 'register' && regStep === 3){
    const draft = loadRegDraft() || {};
    const seatId = draft['f-seat'] || '';
    const amountSel = document.getElementById('pay-amount');
    const otherWrap = document.getElementById('pay-amount-other-wrap');
    otherWrap.style.display = amountSel.value === 'other' ? 'block' : 'none';

    const currentTotal = ()=>{
      const seatBase = amountSel.value === 'other' ? Number(document.getElementById('pay-amount-other').value || 0) : Number(amountSel.value);
      return seatBase + computeLockerCharge(draft);
    };
    const refreshTotal = ()=>{
      const total = currentTotal();
      const totalEl = document.getElementById('pay-total-display');
      if (totalEl) totalEl.textContent = total;
      document.getElementById('upi-qr-img').src = buildUpiQrUrl(total || 1, 'Seat ' + seatId);
    };
    amountSel.onchange = ()=>{ otherWrap.style.display = amountSel.value === 'other' ? 'block' : 'none'; saveRegDraft(); refreshTotal(); };
    const otherInput = document.getElementById('pay-amount-other');
    if (otherInput) otherInput.oninput = ()=>{ saveRegDraft(); refreshTotal(); };

    document.getElementById('pay-back-btn').onclick = ()=>{ saveRegDraft(); goToRegStep(2); };

    const shotInput = document.getElementById('pay-screenshot');
    const shotPreview = document.getElementById('pay-screenshot-preview');
    shotInput.onchange = async ()=>{
      const file = shotInput.files[0];
      if (!file){ shotPreview.style.display = 'none'; shotPreview.innerHTML=''; return; }
      const raw = await readFileAsDataURL(file);
      const resized = await resizeImageDataURL(raw, 900, 0.72);
      shotInput.dataset.resized = resized;
      shotPreview.style.display = 'block';
      shotPreview.innerHTML = `<img src="${resized}" style="max-width:140px;max-height:100px;border-radius:6px;border:1px solid var(--line);">`;
      clearFieldError('pay-screenshot','err-screenshot');
    };

    document.getElementById('pay-submit-btn').onclick = async ()=>{
      clearFieldError('pay-screenshot','err-screenshot');
      const screenshotData = shotInput.dataset.resized;
      if (!screenshotData){ showFieldError('pay-screenshot','err-screenshot','Upload a screenshot of your payment before submitting.'); return; }

      const submitBtn = document.getElementById('pay-submit-btn');
      submitBtn.disabled = true; submitBtn.textContent = 'Submitting…';

      const finalDraft = loadRegDraft() || {};
      const amount = currentTotal();
      if (amount <= 0){
        showFieldError('pay-screenshot','err-screenshot','Enter a valid amount.');
        submitBtn.disabled = false; submitBtn.textContent = 'Submit registration';
        return;
      }

      const payload = {
        name: finalDraft['f-name'],
        phone: finalDraft['f-phone'],
        email: finalDraft['f-email'] || null,
        examPrep: finalDraft['f-exam'],
        joinDate: finalDraft['f-join'],
        durationMonths: Number(finalDraft['f-months']),
        seatId: finalDraft['f-seat'],
        amount,
        rulesAcceptedAt: new Date().toISOString(),
        paymentScreenshotBase64: screenshotData
      };
      if (finalDraft['f-locker']){
        payload.lockerId = finalDraft['f-locker'];
        payload.lockerMonths = Number(finalDraft['f-locker-months']);
      }
      if (finalDraft.idPhotoBase64) payload.photoBase64 = finalDraft.idPhotoBase64;

      try{
        await apiPost('/api/register', payload);
        clearRegDraft();
        await loadPublicAvailability();
        regStep = 4;
        history.pushState({ page: 'register', regStep: 4 }, '', pathForPage('register', 4));
        render();
      }catch(err){
        showToast(err.message || 'Registration failed. Please try again.');
        submitBtn.disabled = false; submitBtn.textContent = 'Submit registration';
        await loadPublicAvailability();
      }
    };
  }

  if (currentPage === 'register' && regStep === 4){
    document.getElementById('done-back-btn').onclick = ()=>{
      regStep = 1;
      navigateTo('availability');
    };
  }

  if (currentPage === 'subscriptions'){
    document.querySelectorAll('.filter-btn').forEach(el=>{
      el.onclick = ()=>{ subFilter = el.dataset.filter; render(); };
    });
    const sortSel = document.getElementById('sub-sort');
    if (sortSel) sortSel.onchange = ()=>{ subSort = sortSel.value; render(); };
    const search = document.getElementById('sub-search');
    search.oninput = ()=>{ subSearch = search.value; render(); };
    search.focus();
    search.setSelectionRange(search.value.length, search.value.length);
    document.querySelectorAll('[data-remove]').forEach(el=>{
      el.onclick = ()=> showRemoveReasonModal(el.dataset.remove, ()=>render());
    });
    document.querySelectorAll('[data-payment]').forEach(el=>{
      el.onclick = ()=> showPaymentModal(el.dataset.payment);
    });
  }

  if (currentPage === 'reports'){
    document.querySelectorAll('.floor-tab[data-reportpreset]').forEach(el=>{
      el.onclick = async ()=>{
        reportsPreset = el.dataset.reportpreset;
        reportsData = null;
        render();
        if (reportsPreset !== 'custom') await loadReportsData();
        render();
      };
    });
    const applyBtn = document.getElementById('report-apply');
    if (applyBtn) applyBtn.onclick = async ()=>{
      reportsFrom = document.getElementById('report-from').value;
      reportsTo = document.getElementById('report-to').value;
      reportsData = null;
      render();
      await loadReportsData();
      render();
    };
  }

  if (currentPage === 'pending'){
    document.querySelectorAll('[data-fetchphoto]').forEach(el=>{
      el.onclick = ()=>{
        const id = el.dataset.fetchphoto;
        const wrap = document.getElementById('photo-preview-' + id);
        renderLoadableThumb(wrap, '/api/pending?photo=1&id=' + id + '&type=id', 'ID proof');
        el.remove();
      };
    });
    document.querySelectorAll('[data-fetchpayment]').forEach(el=>{
      el.onclick = ()=>{
        const id = el.dataset.fetchpayment;
        const wrap = document.getElementById('photo-preview-' + id);
        renderLoadableThumb(wrap, '/api/pending?photo=1&id=' + id + '&type=payment', 'Payment screenshot');
        el.remove();
      };
    });
    document.querySelectorAll('[data-editpending]').forEach(el=>{
      el.onclick = ()=> showEditPendingModal(el.dataset.editpending);
    });
    document.querySelectorAll('[data-reject]').forEach(el=>{
      el.onclick = ()=> showRejectModal(el.dataset.reject);
    });
    document.querySelectorAll('[data-approve]').forEach(el=>{
      el.onclick = async ()=>{
        el.disabled = true; el.textContent = 'Approving…';
        try{
          const result = await apiPost('/api/pending', { action: 'approve', pendingId: el.dataset.approve });
          await loadPendingList(); await loadPublicAvailability();
          if (session) await loadFullStudents();
          render();
          showToast(result.emailSent ? 'Approved — bill emailed to student' : 'Approved (email not sent: ' + (result.emailReason||'not configured') + ')');
        }catch(err){
          showToast(err.message || 'Failed to approve request');
          el.disabled = false; el.textContent = 'Approve';
        }
      };
    });
  }
}

// ============================================================
// Init
// ============================================================
async function init(){
  const parsed = parsePath(location.pathname);
  currentPage = parsed.page;
  if (currentPage === 'register') regStep = parsed.step || 1;

  // Only fall back to resuming an in-progress registration draft when
  // there's no specific deep link in the URL (i.e. someone just opened
  // the site fresh) — an explicit URL always wins.
  if (currentPage === 'availability'){
    const draft = loadRegDraft();
    if (draft && draft.regStep){
      currentPage = 'register';
      regStep = draft.regStep;
      regFloor = draft.regFloor || 'F1';
    }
  }

  await loadPublicAvailability();
  await resolveSession();
  await loadDataForPage(currentPage);

  history.replaceState(
    { page: currentPage, regStep: currentPage === 'register' ? regStep : undefined },
    '',
    pathForPage(currentPage, regStep)
  );
  render();
}
init();
</script>
